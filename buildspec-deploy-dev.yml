version: 0.2

# Stage 3 of the pipeline: DEPLOY TO DEV (direct commit).
# Reads the digest produced by the build stage (image.json), writes it into the
# gitops repo's envs/dev/values.yaml, and commits directly to main.
# dev = direct commit for fast feedback (the researched dev-vs-prod pattern).
# Argo CD (dev app, auto-sync) then deploys the new digest to the dev spoke.

# Let CodeBuild inject the CodeConnection credentials into all git operations.
# This requires the connection to be attached to the project as a source
# credential (secondary source with the connection auth). No tokens in the file.
env:
  git-credential-helper: yes
  variables:
    GITOPS_REPO: "https://github.com/devanshpoplii/pg5-rumbles-gitops.git"
    GITOPS_BRANCH: "main"
    VALUES_PATH: "envs/dev/values.yaml"
    # Commit identity for the automated commit.
    GIT_AUTHOR_NAME: "rumbles-pipeline"
    GIT_AUTHOR_EMAIL: "rumbles-pipeline@users.noreply.github.com"

phases:
  install:
    commands:
      # yq: safe, structured YAML edits (never sed on YAML). Pin a version.
      - echo "Installing yq..."
      - wget -q https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -O /usr/local/bin/yq
      - chmod +x /usr/local/bin/yq

  pre_build:
    commands:
      # image.json comes from the Build stage's output artifact (secondary input).
      # CodePipeline exposes secondary artifacts at $CODEBUILD_SRC_DIR_<name>.
      # The primary source (this repo, with the buildspec) is the working dir.
      - IMAGE_JSON="${CODEBUILD_SRC_DIR_BuildOutput}/image.json"
      - echo "Reading digest from $IMAGE_JSON"
      - cat "$IMAGE_JSON"
      - DIGEST=$(yq -r '.digest' "$IMAGE_JSON")
      - TAG=$(yq -r '.tag' "$IMAGE_JSON")
      - echo "Promoting digest $DIGEST (tag $TAG) to DEV"
      - test -n "$DIGEST" # fail fast if the digest is empty

  build:
    commands:
      # Fail the whole phase on any error (so a failed push does NOT report success).
      - set -e
      # All git work happens in ONE phase. CodeBuild starts each phase in a fresh
      # shell at the source root, so a `cd` in an earlier phase does NOT persist —
      # doing clone + edit + commit + push together keeps the directory context.
      - echo "Cloning gitops repo (git-credential-helper injects connection creds)..."
      - rm -rf gitops
      - git clone --branch "$GITOPS_BRANCH" "$GITOPS_REPO" gitops
      - cd gitops
      # Update the image digest (and readable tag) in the dev values file.
      - yq -i ".image.digest = \"$DIGEST\"" "$VALUES_PATH"
      - yq -i ".image.tag = \"$TAG\"" "$VALUES_PATH"
      - echo "Updated $VALUES_PATH:"
      - yq '.image' "$VALUES_PATH"
      # Commit and push (still inside ./gitops in this same phase/shell).
      - git config user.name "$GIT_AUTHOR_NAME"
      - git config user.email "$GIT_AUTHOR_EMAIL"
      - git add "$VALUES_PATH"
      - |
        if git diff --cached --quiet; then
          echo "No change in $VALUES_PATH; skipping commit."
          exit 0
        fi
        git commit -m "deploy(dev): promote rumbles to $TAG

        Digest: $DIGEST
        Promoted automatically by the rumbles build pipeline."
        # git-credential-helper injects the CodeConnection creds for the push.
        # Explicitly check the push result so a 403/denied FAILS the build
        # instead of silently reporting success.
        if git push origin "$GITOPS_BRANCH"; then
          echo "Successfully committed and pushed dev promotion."
        else
          echo "ERROR: git push failed (see error above)."
          exit 1
        fi
